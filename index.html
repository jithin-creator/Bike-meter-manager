
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike Digital Meter Manager</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#eef2f7;color:#172033;margin:0}
header{background:#123d65;color:white;text-align:center;padding:18px}
main{max-width:700px;margin:auto;padding:12px}
.card{background:white;padding:15px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
input,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid #bbb;border-radius:7px;font-size:16px}
button{background:#145b91;color:white;border:0;font-weight:bold}
.green{background:#16834b}
.red{background:#b52c35}
.grey{background:#526579}
label{display:block;margin-top:12px;font-weight:bold}
.customer{border-top:1px solid #ddd;padding:12px 0}
.photo{width:100%;max-height:200px;object-fit:contain;margin:5px 0}
#qrcode{display:flex;justify-content:center;margin:15px}
#reader{width:100%;margin-top:10px}
.small{font-size:13px;color:#555}
</style>
</head>

<body>
<header>
<h2>Bike Digital Meter Manager</h2>
<p>ബൈക്ക് ഡിജിറ്റൽ മീറ്റർ കസ്റ്റമർ മാനേജർ</p>
</header>

<main>

<div class="card">
<h3>Customer / കസ്റ്റമർ വിവരങ്ങൾ</h3>

<input id="name" placeholder="Customer Name / പേര്">
<input id="phone" placeholder="Mobile Number / മൊബൈൽ നമ്പർ" type="tel">
<input id="bike" placeholder="Bike Model / ബൈക്ക് മോഡൽ">
<input id="meter" placeholder="Meter Model / മീറ്റർ മോഡൽ">
<input id="pcb" placeholder="PCB Company / PCB കമ്പനി">
<input id="pcbno" placeholder="PCB Number / PCB നമ്പർ">
<input id="ic" placeholder="Main IC Number / IC നമ്പർ">
<input id="fault" placeholder="Repair Fault / തകരാർ">
<input id="rack" placeholder="Rack Location / റാക്ക് സ്ഥലം">
<input id="amount" type="number" placeholder="Repair Amount / റിപ്പയർ തുക">
<textarea id="notes" placeholder="Repair Notes / റിപ്പയർ കുറിപ്പുകൾ"></textarea>

<label>Meter Photo / മീറ്റർ ഫോട്ടോ</label>
<input id="meterPhoto" type="file" accept="image/*" capture="environment">

<label>PCB Photo / PCB ഫോട്ടോ</label>
<input id="pcbPhoto" type="file" accept="image/*" capture="environment">

<button onclick="saveCustomer()">SAVE CUSTOMER / സേവ് ചെയ്യുക</button>
<p id="message"></p>
</div>

<div class="card">
<h3>QR Scanner / QR സ്കാനർ</h3>
<button onclick="startScanner()">OPEN CAMERA & SCAN QR</button>
<div id="reader"></div>
<button class="grey" onclick="stopScanner()">STOP CAMERA</button>
<p id="scanMessage" class="small">QR സ്കാൻ ചെയ്യാൻ ക്യാമറ അനുവദിക്കുക.</p>
</div>

<div class="card">
<h3>Generate Customer QR / QR ഉണ്ടാക്കുക</h3>
<input id="qrId" placeholder="Customer ID">
<button onclick="showQR()">GENERATE QR CODE</button>
<div id="qrcode"></div>
</div>

<div class="card">
<h3>Search Customer / കസ്റ്റമറെ തിരയുക</h3>
<input id="search" placeholder="Name / Phone / ID / Bike" oninput="showCustomers()">
<div id="customers"></div>
</div>

<div class="card">
<h3>Backup & Restore / ഡാറ്റ ബാക്കപ്പ്</h3>
<button class="green" onclick="backupData()">DOWNLOAD FULL BACKUP</button>
<label>Choose Backup File / ബാക്കപ്പ് ഫയൽ തിരഞ്ഞെടുക്കുക</label>
<input type="file" id="backupFile" accept=".json,application/json">
<button onclick="restoreData()">RESTORE BACKUP</button>
<p id="backupMessage" class="small"></p>
</div>

</main>

<script>
const DB_NAME="BikeMeterManagerComplete";
let db;
let scanner=null;

function openDB(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{
   const d=r.result;
   d.createObjectStore("customers",{keyPath:"id"});
  };
  r.onsuccess=()=>{db=r.result;resolve()};
  r.onerror=()=>reject(r.error);
 });
}

function getAll(){
 return new Promise((resolve,reject)=>{
  const r=db.transaction("customers").objectStore("customers").getAll();
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}

function nextId(all){
 let max=0;
 all.forEach(c=>{
  const n=parseInt((c.id||"").replace("DM-",""),10);
  if(Number.isFinite(n)&&n>max)max=n;
 });
 return "DM-"+String(max+1).padStart(6,"0");
}

function readFile(input){
 return input.files[0]||null;
}

async function saveCustomer(){
 const name=document.getElementById("name").value.trim();
 if(!name){alert("Customer Name നൽകുക");return;}

 try{
  const all=await getAll();
  const id=nextId(all);

  const customer={
   id,
   name,
   phone:phone.value,
   bike:bike.value,
   meter:meter.value,
   pcb:pcb.value,
   pcbno:pcbno.value,
   ic:ic.value,
   fault:fault.value,
   rack:rack.value,
   amount:amount.value,
   notes:notes.value,
   date:new Date().toISOString(),
   meterPhoto:readFile(meterPhoto),
   pcbPhoto:readFile(pcbPhoto)
  };

  const tx=db.transaction("customers","readwrite");
  tx.objectStore("customers").add(customer);

  tx.oncomplete=()=>{
   message.textContent="Saved! Customer ID: "+id;
   qrId.value=id;
   document.querySelectorAll(
    "#name,#phone,#bike,#meter,#pcb,#pcbno,#ic,#fault,#rack,#amount,#notes,#meterPhoto,#pcbPhoto"
   ).forEach(x=>x.value="");
   showCustomers();
   showQR();
  };
  tx.onerror=()=>alert("Save failed");
 }catch(e){alert("Error: "+e.message);}
}

async function showCustomers(){
 const all=await getAll();
 const q=document.getElementById("search").value.toLowerCase();
 const box=document.getElementById("customers");
 box.innerHTML="";

 all.filter(c=>
  [c.id,c.name,c.phone,c.bike,c.meter,c.pcb,c.fault]
  .some(v=>String(v||"").toLowerCase().includes(q))
 ).reverse().forEach(c=>{
  const div=document.createElement("div");
  div.className="customer";

  const heading=document.createElement("h3");
  heading.textContent=c.id+" - "+c.name;
  div.appendChild(heading);

  const info=document.createElement("p");
  info.textContent=
   "Phone: "+c.phone+
   " | Bike: "+c.bike+
   " | Meter: "+c.meter+
   " | PCB: "+c.pcb+
   " | PCB No: "+c.pcbno+
   " | IC: "+c.ic+
   " | Fault: "+c.fault+
   " | Rack: "+c.rack+
   " | Amount: "+c.amount+
   " | Notes: "+c.notes;
  div.appendChild(info);

  if(c.meterPhoto){
   const img=document.createElement("img");
   img.className="photo";
   img.src=URL.createObjectURL(c.meterPhoto);
   div.appendChild(img);
  }

  if(c.pcbPhoto){
   const img=document.createElement("img");
   img.className="photo";
   img.src=URL.createObjectURL(c.pcbPhoto);
   div.appendChild(img);
  }

  const qr=document.createElement("button");
  qr.textContent="SHOW QR";
  qr.onclick=()=>{
   qrId.value=c.id;
   showQR();
   window.scrollTo({top:0,behavior:"smooth"});
  };
  div.appendChild(qr);

  const del=document.createElement("button");
  del.className="red";
  del.textContent="DELETE CUSTOMER";
  del.onclick=()=>deleteCustomer(c.id);
  div.appendChild(del);

  box.appendChild(div);
 });
}

function deleteCustomer(id){
 if(!confirm("Delete this customer?"))return;
 const tx=db.transaction("customers","readwrite");
 tx.objectStore("customers").delete(id);
 tx.oncomplete=showCustomers;
}

function showQR(){
 const id=document.getElementById("qrId").value.trim();
 if(!id){alert("Customer ID നൽകുക");return;}

 const box=document.getElementById("qrcode");
 box.innerHTML="";

 if(typeof QRCode==="undefined"){
  box.textContent="QR library needs internet.";
  return;
 }
 new QRCode(box,{text:id,width:200,height:200});
}

async function startScanner(){
 const msg=document.getElementById("scanMessage");
 if(!window.Html5Qrcode){
  msg.textContent="QR scanner library load ആയില്ല. Internet പരിശോധിക്കുക.";
  return;
 }

 try{
  if(scanner)await stopScanner();

  scanner=new Html5Qrcode("reader");

  await scanner.start(
   {facingMode:"environment"},
   {fps:10,qrbox:{width:230,height:230}},
   async text=>{
    document.getElementById("search").value=text;
    msg.textContent="Scanned: "+text;
    await stopScanner();
    showCustomers();
   },
   ()=>{}
  );
  msg.textContent="Camera started. QR കാണിക്കുക.";
 }catch(e){
  msg.textContent="Camera error: "+e;
 }
}

async function stopScanner(){
 if(scanner){
  try{
   if(scanner.isScanning)await scanner.stop();
   scanner.clear();
  }catch(e){}
  scanner=null;
 }
}

function blobToData(blob){
 return new Promise((resolve,reject)=>{
  if(!blob){resolve(null);return;}
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(blob);
 });
}

function dataToBlob(data){
 if(!data)return null;
 const parts=data.split(",");
 const mime=parts[0].match(/:(.*?);/)[1];
 const binary=atob(parts[1]);
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 return new Blob([bytes],{type:mime});
}

async function backupData(){
 try{
  const all=await getAll();
  const records=[];

  for(const c of all){
   records.push({
    ...c,
    meterPhoto:await blobToData(c.meterPhoto),
    pcbPhoto:await blobToData(c.pcbPhoto)
   });
  }

  const backup={
   app:"Bike Digital Meter Manager",
   version:1,
   date:new Date().toISOString(),
   customers:records
  };

  const blob=new Blob(
   [JSON.stringify(backup)],
   {type:"application/json"}
  );
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="BikeMeterBackup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);

  backupMessage.textContent="Backup downloaded successfully!";
 }catch(e){
  alert("Backup failed: "+e.message);
 }
}

async function restoreData(){
 const file=document.getElementById("backupFile").files[0];
 if(!file){alert("Backup file തിരഞ്ഞെടുക്കുക");return;}
 if(!confirm("Restore ചെയ്യുമ്പോൾ ഇപ്പോഴുള്ള ഡാറ്റ മുഴുവനും മാറ്റപ്പെടും. ആദ്യം അതിന്റെ Backup എടുത്തിട്ടുണ്ടോ?"))return;

 try{
  const data=JSON.parse(await file.text());
  if(data.app!=="Bike Digital Meter Manager"||
     !Array.isArray(data.customers)){
   throw new Error("Invalid backup file");
  }

  const records=data.customers.map(c=>({
   ...c,
   meterPhoto:dataToBlob(c.meterPhoto),
   pcbPhoto:dataToBlob(c.pcbPhoto)
  }));

  const tx=db.transaction("customers","readwrite");
  const os=tx.objectStore("customers");
  os.clear();
  records.forEach(c=>os.put(c));

  tx.oncomplete=()=>{
   backupMessage.textContent="Restore completed!";
   showCustomers();
  };
  tx.onerror=()=>alert("Restore failed");
 }catch(e){
  alert("Restore failed: "+e.message);
 }
}

openDB().then(showCustomers).catch(e=>{
 alert("Database error: "+e.message);
});
</script>
</body>
</html>
